name: Google Job Watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TOP_N: "5"
          ALWAYS_SEND_TOP5: "true"
        run: python watch_jobs.py

      - name: Upload debug files if extraction fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgradjobs-debug
          path: |
            debug-newgradjobs.png
            debug-newgradjobs.html
          if-no-files-found: ignore

      - name: Commit updated seen jobs
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "job-watcher-bot@users.noreply.github.com"

          if [ -f seen_jobs.json ]; then
            git add seen_jobs.json
            git diff --cached --quiet || git commit -m "Update seen NewGradJobs roles"
            git push
          else
            echo "seen_jobs.json not found, skipping commit"
          fi